# =====================================================================
#  CHU — Couche Data Lake (HDFS + Hive + Spark)
#  Stack Big Data Europe. Zone d'atterrissage des données brutes (FTP /
#  fichiers distribués) avant alimentation du Data Warehouse PostgreSQL.
#
#  Démarrage :  docker compose up -d
#  Arrêt     :  docker compose down            (ajouter -v pour purger HDFS)
#
#  Interfaces web :
#    - HDFS NameNode  : http://localhost:9870
#    - HDFS DataNode  : http://localhost:9864
#    - HiveServer2 UI : http://localhost:10002
#    - Spark Master   : http://localhost:8080
# =====================================================================
services:
  # ---------------- HDFS ----------------
  namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    container_name: namenode
    restart: unless-stopped
    environment:
      - CLUSTER_NAME=chu-datalake
    env_file:
      - ./hadoop.env
    volumes:
      - hadoop_namenode:/hadoop/dfs/name
      # Les sources locales sont montées (lecture seule) pour l'ingestion HDFS
      - ../sources:/sources:ro
    ports:
      - "9870:9870"      # UI NameNode
      - "9000:9000"      # RPC HDFS (fs.defaultFS)

  datanode:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: datanode
    restart: unless-stopped
    environment:
      SERVICE_PRECONDITION: "namenode:9870"
    env_file:
      - ./hadoop.env
    volumes:
      - hadoop_datanode:/hadoop/dfs/data
    ports:
      - "9864:9864"      # UI DataNode

  # ---------------- Hive (SQL-on-HDFS) ----------------
  hive-metastore-postgresql:
    image: bde2020/hive-metastore-postgresql:2.3.0
    container_name: hive-metastore-postgresql
    restart: unless-stopped

  hive-metastore:
    image: bde2020/hive:2.3.2-postgresql-metastore
    container_name: hive-metastore
    restart: unless-stopped
    command: /opt/hive/bin/hive --service metastore
    env_file:
      - ./hadoop.env
    environment:
      SERVICE_PRECONDITION: "namenode:9000 datanode:9864 hive-metastore-postgresql:5432"
    ports:
      - "9083:9083"

  hive-server:
    image: bde2020/hive:2.3.2-postgresql-metastore
    container_name: hive-server
    restart: unless-stopped
    env_file:
      - ./hadoop.env
    environment:
      HIVE_CORE_CONF_javax_jdo_option_ConnectionURL: "jdbc:postgresql://hive-metastore-postgresql/metastore"
      SERVICE_PRECONDITION: "hive-metastore:9083"
    ports:
      - "10000:10000"    # JDBC (beeline / Power BI / DBeaver)
      - "10002:10002"    # UI HiveServer2

  # ---------------- Spark (moteur de traitement) ----------------
  spark-master:
    image: bde2020/spark-master:3.1.1-hadoop3.2
    container_name: spark-master
    restart: unless-stopped
    env_file:
      - ./hadoop.env
    volumes:
      - ./spark:/app
    ports:
      - "8080:8080"      # UI Spark Master
      - "7077:7077"      # soumission de jobs

  spark-worker:
    image: bde2020/spark-worker:3.1.1-hadoop3.2
    container_name: spark-worker
    restart: unless-stopped
    depends_on:
      - spark-master
    environment:
      - SPARK_MASTER=spark://spark-master:7077
    env_file:
      - ./hadoop.env
    ports:
      - "8081:8081"      # UI Spark Worker

volumes:
  hadoop_namenode:
  hadoop_datanode:
